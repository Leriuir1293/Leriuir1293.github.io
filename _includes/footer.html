<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-text">
      © {{ 'now' | date: "%Y" }} {{ site.data.profile.name }}.
      Built with <a href="https://jekyllrb.com/">Jekyll</a> on
      <a href="https://pages.github.com/">GitHub Pages</a>.
    </p>
    <div class="footer-links">
      {% if site.data.profile.links.github != "" %}
      <a href="{{ site.data.profile.links.github }}" target="_blank" rel="noopener">GitHub</a>
      {% endif %}
      {% if site.data.profile.email != "" %}
      <a href="mailto:{{ site.data.profile.email }}">Email</a>
      {% endif %}
    </div>
  </div>
</footer>
