<header class="site-header">
  <div class="container header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="site-nav">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url or page.url contains item.url %}class="is-active" aria-current="page"{% endif %}>
        {{ item.title }}
      </a>
      {% endfor %}
    </nav>
  </div>
</header>
