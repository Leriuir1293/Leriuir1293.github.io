<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main class="site-main" id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/mobile-nav.js' | relative_url }}" defer></script>
  {% if page.layout == 'note-list' %}
  <script src="{{ '/assets/js/notes-search.js' | relative_url }}" defer></script>
  {% endif %}
  {% if page.layout == 'blog-list' %}
  <script src="{{ '/assets/js/blog-search.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
